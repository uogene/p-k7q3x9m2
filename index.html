header{max-width:1100px;margin:0 auto;padding:40px 16px 8px}
h1{margin:0;font-size:1.9rem;letter-spacing:-.02em}
header p{margin:6px 0 0;color:var(--muted)}
.brand{font-size:.8rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.card{box-shadow:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.04)}
.grid{max-width:1100px;margin:0 auto;padding:24px 16px 48px;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.thumb{aspect-ratio:1;background:linear-gradient(180deg,#d8dbdd,#b9bec2);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.85rem}
@media (prefers-color-scheme:dark){.thumb{background:linear-gradient(180deg,#3a3d40,#26282a)}}
#stage{background:linear-gradient(180deg,#d8dbdd,#b9bec2)}
@media (prefers-color-scheme:dark){#stage{background:linear-gradient(180deg,#3a3d40,#26282a)}}
.thumb img{width:100%;height:100%;object-fit:contain}
.info{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.name{font-weight:600}
.meta{font-size:.82rem;color:var(--muted)}
.actions{display:flex;gap:8px;margin-top:auto;padding-top:10px}
.btn{flex:1;text-align:center;padding:8px 10px;border-radius:9px;font-size:.88rem;text-decoration:none;border:1px solid var(--line);color:var(--ink);background:transparent;cursor:pointer;font-family:inherit}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(.95)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal.open{display:flex}
.viewer{background:var(--card);border-radius:14px;width:min(900px,100%);height:min(680px,90vh);display:flex;flex-direction:column;overflow:hidden}
.vbar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.vbar .name{flex:1}
#stage{flex:1;position:relative}
#stage canvas{display:block;width:100%;height:100%}
.hint{position:absolute;left:12px;bottom:10px;font-size:.78rem;color:var(--muted)}
nav.tabs{display:flex;gap:6px;margin-top:16px}
nav.tabs a{padding:7px 14px;border-radius:999px;text-decoration:none;color:var(--ink);font-size:.9rem;border:1px solid var(--line);background:var(--card)}
nav.tabs a.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.page{display:none}.page.on{display:block}
.tracks{max-width:1100px;margin:0 auto;padding:24px 16px 48px;display:flex;flex-direction:column;gap:14px}
.track{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;gap:16px;align-items:center;box-shadow:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.04)}
.play{flex:0 0 56px;height:56px;border-radius:50%;border:none;background:var(--accent);color:var(--accent-ink);cursor:pointer;display:flex;align-items:center;justify-content:center}
.play svg{width:22px;height:22px}
.tbody{flex:1;min-width:0}
.ttop{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
.ttitle{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttime{font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.wave{width:100%;height:64px;display:block;cursor:pointer}
.tdl{font-size:.8rem;color:var(--muted);text-decoration:none;margin-left:10px}
.tdl:hover{color:var(--ink)}
.empty{color:var(--muted);text-align:center;padding:40px}
footer{text-align:center;color:var(--muted);font-size:.8rem;padding:0 16px 32px}
</style>

// 'preview' (optional) = lighter STL used only for the 3D view.
const MODELS = [
  {file:'lamp_cover_D78.stl', name:'Lamp cover Ø78'},
  {file:'lamp_cover_D69.stl', name:'Lamp cover Ø69'},
  {file:'irrigator_holder_v2.stl', name:'Irrigator holder v2'},
  {file:'board_clip_radiator_v3.stl', name:'Board clip for radiator v3'},
  {file:'cap_P2.00_v4_grip.3mf', preview:'cap_P2.00_v4_grip_preview.stl', name:'Cap P2.00 with grip v4'},
  {file:'fishing_tripod_rocks_v2_100mm.stl', name:'Fishing rod tripod for rocks v2'},
  {file:'toothbrush_holder_v11.stl', name:'Toothbrush & toothpaste holder v11'},
  {file:'piggy_bank_v2.stl', name:'Piggy bank v2'},
];

const color = 0xf4f4f2;
function loadModel(file){
  return new Promise((res, rej) => {
    new STLLoader().load('models/' + file, geo => {
      geo.computeVertexNormals();
      res(new THREE.Mesh(geo, new THREE.MeshStandardMaterial({color, roughness:.6, metalness:0})));
    }, undefined, rej);
  });
}

// Z-up (3D printing) to Y-up (three.js), centered on the floor
function prepare(obj){
  const wrap = new THREE.Group();
  obj.rotation.x = -Math.PI/2;
  wrap.add(obj);
  const box = new THREE.Box3().setFromObject(wrap);
  const c = box.getCenter(new THREE.Vector3());
  obj.position.set(-c.x, -box.min.y, -c.z);
  wrap.updateMatrixWorld(true);
  const b2 = new THREE.Box3().setFromObject(wrap);
  const size = b2.getSize(new THREE.Vector3());
  return {wrap, size};
}

function makeScene(){
  const scene = new THREE.Scene();
  scene.add(new THREE.HemisphereLight(0xffffff, 0x666a70, 0.9));
  const d1 = new THREE.DirectionalLight(0xffffff, 1.3); d1.position.set(3,5,4); scene.add(d1);
  const d2 = new THREE.DirectionalLight(0xffffff, .5); d2.position.set(-4,2,-3); scene.add(d2);
  return scene;
}
function frame(camera, size){
  const r = size.length()/2;
  const dist = r / Math.sin(THREE.MathUtils.degToRad(camera.fov/2)) * 1.08;
  const dir = new THREE.Vector3(0.62, 0.5, 0.6).normalize();
  camera.position.copy(dir.multiplyScalar(dist)).add(new THREE.Vector3(0, size.y/2, 0));
  camera.near = r/100; camera.far = r*50; camera.updateProjectionMatrix();
  return new THREE.Vector3(0, size.y/2, 0);
}

// Thumbnails: one shared renderer, rendered to images
const tr = new THREE.WebGLRenderer({antialias:true, alpha:true, preserveDrawingBuffer:true});
tr.setSize(480, 480);
const grid = document.getElementById('grid');
const cache = {};

for (const m of MODELS) {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `<div class="thumb">Loading…</div><div class="info"><div class="name"></div><div class="meta"></div>
    <div class="actions"><button class="btn view">View 3D</button><a class="btn primary" download>Download</a></div></div>`;
  card.querySelector('.name').textContent = m.name;
  card.querySelector('a').href = 'models/' + m.file;
  card.querySelector('.thumb').onclick = card.querySelector('.view').onclick = () => openViewer(m);
  grid.appendChild(card);
  m.card = card;
}

for (const m of MODELS) {
  try {
    const obj = await loadModel(m.preview || m.file);
    cache[m.file] = obj;
    const {wrap, size} = prepare(obj.clone());
    const scene = makeScene(); scene.add(wrap);
    const cam = new THREE.PerspectiveCamera(35, 1, .1, 1000);
    cam.lookAt(frame(cam, size));
    tr.render(scene, cam);
    const img = new Image(); img.src = tr.domElement.toDataURL('image/png'); img.alt = m.name;
    const t = m.card.querySelector('.thumb'); t.textContent = ''; t.appendChild(img);
    const ext = m.file.split('.').pop().toUpperCase();
    m.card.querySelector('.meta').textContent = `${size.x.toFixed(0)} × ${size.z.toFixed(0)} × ${size.y.toFixed(0)} mm · ${ext}`;
  } catch (e) {
    m.card.querySelector('.thumb').textContent = 'Preview unavailable';
  }
}

// Interactive viewer
const modal = document.getElementById('modal'), stage = document.getElementById('stage');
const vr = new THREE.WebGLRenderer({antialias:true, alpha:true});
vr.setPixelRatio(Math.min(devicePixelRatio, 2));
stage.prepend(vr.domElement);
const vcam = new THREE.PerspectiveCamera(35, 1, .1, 1000);
const controls = new OrbitControls(vcam, vr.domElement);
controls.enableDamping = true;
let vscene = null, running = false;

async function openViewer(m){
  document.getElementById('vname').textContent = m.name;
  document.getElementById('vdl').href = 'models/' + m.file;
  document.getElementById('vdl').setAttribute('download', '');
  modal.classList.add('open');
  const obj = cache[m.file] || (cache[m.file] = await loadModel(m.preview || m.file));
  const {wrap, size} = prepare(obj.clone());
  vscene = makeScene(); vscene.add(wrap);
  const g = new THREE.GridHelper(Math.max(size.x, size.z)*2, 20, 0x999999, 0xcccccc);
  g.material.opacity = .35; g.material.transparent = true; vscene.add(g);
  controls.target.copy(frame(vcam, size)); controls.update();
  resize();
  if (!running) { running = true; loop(); }
}
function resize(){
  const w = stage.clientWidth, h = stage.clientHeight;
  vr.setSize(w, h, false); vcam.aspect = w/h; vcam.updateProjectionMatrix();
}
function loop(){
  if (!modal.classList.contains('open')) { running = false; return; }
  controls.update(); vr.render(vscene, vcam); requestAnimationFrame(loop);
}
function closeViewer(){ modal.classList.remove('open'); }
document.getElementById('vclose').onclick = closeViewer;
modal.onclick = e => { if (e.target === modal) closeViewer(); };
addEventListener('keydown', e => { if (e.key === 'Escape') closeViewer(); });
addEventListener('resize', () => { if (modal.classList.contains('open')) resize(); });
</script>

<script>
// ===== Pages =====
const PAGES={models:['3D Model Gallery','My 3D-printable models. Click a model to rotate it, or download the file.'],
             audio:['Audio Berry','My recordings. Press play, click the waveform to jump.']};
function show(){const p=(location.hash.slice(1) in PAGES)?location.hash.slice(1):'models';
  document.querySelectorAll('.page').forEach(e=>e.classList.toggle('on',e.id==='p-'+p));
  document.querySelectorAll('nav.tabs a').forEach(a=>a.classList.toggle('on',a.dataset.p===p));
  document.getElementById('ptitle').textContent=PAGES[p][0];document.getElementById('psub').textContent=PAGES[p][1];
  if(p==='audio')initAudio();}
addEventListener('hashchange',show);

// ===== Audio Berry =====
// To add a track: put the mp3 in /audio and add a line here.
const TRACKS=[
];
const ICON_PLAY='<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>';
const ICON_PAUSE='<svg viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z" fill="currentColor"/></svg>';
const fmt=t=>isFinite(t)?Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0'):'0:00';
let audioInit=false,current=null;
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}
function initAudio(){
  if(audioInit)return;audioInit=true;
  const box=document.getElementById('tracks');
  if(!TRACKS.length){box.innerHTML='<div class="empty">No tracks yet</div>';return;}
  for(const t of TRACKS){
    const el=document.createElement('div');el.className='track';
    el.innerHTML=`<button class="play" aria-label="Play">${ICON_PLAY}</button>
      <div class="tbody"><div class="ttop"><span class="ttitle"></span><span><span class="ttime">0:00 / 0:00</span><a class="tdl" download>Download</a></span></div>
      <canvas class="wave"></canvas></div>`;
    el.querySelector('.ttitle').textContent=t.title;
    el.querySelector('.tdl').href='audio/'+t.file;
    box.appendChild(el);
    const a=new Audio('audio/'+t.file);a.preload='metadata';
    const btn=el.querySelector('.play'),cv=el.querySelector('.wave'),tm=el.querySelector('.ttime');
    t.a=a;t.peaks=null;
    const draw=()=>{const dpr=devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;
      cv.width=w*dpr;cv.height=h*dpr;const c=cv.getContext('2d');c.scale(dpr,dpr);
      const bw=3,gap=1.5,n=Math.floor(w/(bw+gap)),prog=a.duration?a.currentTime/a.duration:0;
      const on=css('--accent')||'#7fd8b8',off=matchMedia('(prefers-color-scheme:dark)').matches?'#4a4a48':'#cfcdc6';
      for(let i=0;i<n;i++){const p=t.peaks?t.peaks[Math.floor(i/n*t.peaks.length)]:0.15;
        const bh=Math.max(2,p*h*0.95);c.fillStyle=(i/n)<prog?on:off;
        c.fillRect(i*(bw+gap),(h-bh)/2,bw,bh);} };
    t.draw=draw;draw();addEventListener('resize',draw);
    // waveform peaks (decoded in browser)
    fetch('audio/'+t.file).then(r=>r.arrayBuffer()).then(b=>new (window.AudioContext||window.webkitAudioContext)().decodeAudioData(b)).then(buf=>{
      const d=buf.getChannelData(0),N=400,step=Math.floor(d.length/N),pk=[];let mx=0;
      for(let i=0;i<N;i++){let m=0;for(let j=i*step;j<(i+1)*step;j+=16){const v=Math.abs(d[j]);if(v>m)m=v;}pk.push(m);if(m>mx)mx=m;}
      t.peaks=pk.map(v=>Math.pow(v/(mx||1),0.8));draw();}).catch(()=>{});
    a.addEventListener('loadedmetadata',()=>tm.textContent=`0:00 / ${fmt(a.duration)}`);
    a.addEventListener('timeupdate',()=>{tm.textContent=`${fmt(a.currentTime)} / ${fmt(a.duration)}`;draw();});
    a.addEventListener('ended',()=>{btn.innerHTML=ICON_PLAY;});
    btn.onclick=()=>{if(a.paused){if(current&&current!==t){current.a.pause();}current=t;a.play();}else a.pause();};
    a.addEventListener('play',()=>btn.innerHTML=ICON_PAUSE);
    a.addEventListener('pause',()=>btn.innerHTML=ICON_PLAY);
    cv.onclick=e=>{if(!a.duration)return;const r=cv.getBoundingClientRect();a.currentTime=(e.clientX-r.left)/r.width*a.duration;
      if(a.paused){if(current&&current!==t)current.a.pause();current=t;a.play();}};
  }
}
show();
</script>
</body>
</html>
